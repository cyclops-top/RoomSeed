name: Native ICU
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to validate (all runs the full matrix)
        type: choice
        default: all
        options:
          - all
          - windows-x86_64
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"
  pull_request:
    paths:
      - 'seed-gradle-plugin/**'
      - '.github/workflows/native-icu.yml'
concurrency:
  group: native-icu-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.platform == 'windows-x86_64' && '{"include":[{"runner":"windows-2022","platform":"windows-x86_64"}]}' || '{"include":[{"runner":"macos-15","platform":"macos-aarch64"},{"runner":"ubuntu-24.04","platform":"linux-x86_64"},{"runner":"ubuntu-24.04-arm","platform":"linux-aarch64"},{"runner":"windows-2022","platform":"windows-x86_64"}]}') }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' || github.ref_type == 'tag' }}
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: MINGW64
          update: true
          install: git make curl unzip mingw-w64-x86_64-gcc
      - name: Fingerprint Unix ICU toolchain
        if: runner.os != 'Windows'
        id: icu-key-unix
        shell: bash
        run: echo "key=$(bash seed-gradle-plugin/src/main/native/cache-key.sh)" >> "$GITHUB_OUTPUT"
      - name: Fingerprint Windows ICU toolchain
        if: runner.os == 'Windows'
        id: icu-key-windows
        shell: msys2 {0}
        run: echo "key=$(bash seed-gradle-plugin/src/main/native/cache-key.sh)" >> "$GITHUB_OUTPUT"
      - name: Restore ICU installation
        id: icu-cache
        uses: actions/cache/restore@v4
        with:
          path: seed-gradle-plugin/build/native-host/install
          key: icu-v1-${{ matrix.platform }}-${{ steps.icu-key-unix.outputs.key || steps.icu-key-windows.outputs.key }}
      - name: Build Unix extension
        if: runner.os != 'Windows'
        shell: bash
        run: bash seed-gradle-plugin/src/main/native/build-host.sh
      - name: Build Windows extension
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: bash seed-gradle-plugin/src/main/native/build-host.sh
      - name: Save successfully built ICU installation
        if: steps.icu-cache.outputs.cache-hit != 'true' && github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: seed-gradle-plugin/build/native-host/install
          key: ${{ steps.icu-cache.outputs.cache-primary-key }}
      - name: Test actual host binary
        shell: bash
        run: ./gradlew -p seed-gradle-plugin test --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: icu-${{ matrix.platform }}
          path: seed-gradle-plugin/src/main/resources/native/${{ matrix.platform }}/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-${{ matrix.platform }}
          path: seed-gradle-plugin/build/reports/tests/

  distribution:
    if: inputs.platform != 'windows-x86_64'
    needs: native
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' || github.ref_type == 'tag' }}
      - uses: actions/download-artifact@v4
        with:
          pattern: icu-*
          path: native-artifacts
      - name: Collect verified platforms
        shell: bash
        run: |
          for artifact in native-artifacts/icu-*; do
            platform="${artifact##*/icu-}"
            mkdir -p "seed-gradle-plugin/src/main/resources/native/$platform"
            cp "$artifact"/* "seed-gradle-plugin/src/main/resources/native/$platform/"
          done
      - name: Test and package distribution
        run: ./gradlew -p seed-gradle-plugin test jar -PrequireAllNativePlatforms=true --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: room-seed-multiplatform
          path: seed-gradle-plugin/build/libs/*.jar

      - name: Validate release tag
        if: github.event_name == 'push' && github.ref_type == 'tag'
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
      - name: Prepare signing key
        if: github.event_name == 'push' && github.ref_type == 'tag'
        shell: bash
        env:
          KEYRING: ${{ secrets.SIGNING_KEYRING_BASE64 }}
        run: |
          umask 077
          test -n "$KEYRING"
          printf '%s' "$KEYRING" | base64 --decode > "$RUNNER_TEMP/roomseed-signing.gpg"
      - name: Publish and release to Maven Central
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signing.keyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signing.password: ${{ secrets.SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_signing.secretKeyRingFile: ${{ runner.temp }}/roomseed-signing.gpg
          ORG_GRADLE_PROJECT_releaseVersion: ${{ github.ref_name }}
        run: ./gradlew -p seed-gradle-plugin publishAndReleaseToMavenCentral -PrequireAllNativePlatforms=true --no-daemon
      - name: Remove signing key
        if: always() && github.event_name == 'push' && github.ref_type == 'tag'
        shell: bash
        run: rm -f "$RUNNER_TEMP/roomseed-signing.gpg"
