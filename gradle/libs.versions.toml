[versions]
agp = "9.4.1"
ksp = "2.3.12"
room = "2.8.5"
room3 = "3.0.3"
gson = "2.11.0"
junit = "4.13.2"
sqlite = "2.7.1"
coroutines = "1.9.0"
snakeyaml = "2.6"

[libraries]
agp-api = { module = "com.android.tools.build:gradle-api", version.ref = "agp" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
junit = { module = "junit:junit", version.ref = "junit" }
snakeyaml = { module = "org.yaml:snakeyaml", version.ref = "snakeyaml" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
sqlite-bundled-jvm = { module = "androidx.sqlite:sqlite-bundled-jvm", version.ref = "sqlite" }
sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
room-gradle-plugin = { module = "androidx.room:room-gradle-plugin", version.ref = "room" }
room3-runtime = { module = "androidx.room3:room3-runtime", version.ref = "room3" }
room3-compiler = { module = "androidx.room3:room3-compiler", version.ref = "room3" }
room3-gradle-plugin = { module = "androidx.room3:room3-gradle-plugin", version.ref = "room3" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
room = { id = "androidx.room", version.ref = "room" }
room3 = { id = "androidx.room3", version.ref = "room3" }
